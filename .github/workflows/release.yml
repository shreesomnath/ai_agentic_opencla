name: Build and Release Agentic-LCA

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags, e.g., v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable_name: Agentic-LCA-Linux
            artifact_name: Agentic-LCA-Linux
            pyinstaller_output: dist/Agentic-LCA
          - os: windows-latest
            executable_name: Agentic-LCA-Windows.exe
            artifact_name: Agentic-LCA-Windows
            pyinstaller_output: dist/Agentic-LCA.exe
          - os: macos-latest
            executable_name: Agentic-LCA-MacOS
            artifact_name: Agentic-LCA-MacOS
            pyinstaller_output: dist/Agentic-LCA

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: python build.py

      - name: Rename Executable for Platform
        run: |
          mv ${{ matrix.pyinstaller_output }} dist/${{ matrix.executable_name }}
        if: runner.os != 'Windows'

      - name: Rename Executable for Windows
        run: |
          ren ${{ matrix.pyinstaller_output }} ${{ matrix.executable_name }}
        if: runner.os == 'Windows'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/Agentic-LCA-Linux/Agentic-LCA-Linux
            dist-artifacts/Agentic-LCA-Windows/Agentic-LCA-Windows.exe
            dist-artifacts/Agentic-LCA-MacOS/Agentic-LCA-MacOS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
